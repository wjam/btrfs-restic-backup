name: ci.yml
on:
  push: {}

permissions:
  contents: read

concurrency: # Avoid needlessly continuing the workflow when there's a newer commit
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint files
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: 'false'

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          advanced-security: 'false'
          persona: auditor
          annotations: 'true'

      - name: Run ShellCheck
        run: find . -type f -name "*.sh" -exec shellcheck {} +

  restore:
    name: Restore test
    # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-24.04", "ubuntu-26.04"]
    env:
      RESTIC_REPOSITORY: ${{ github.workspace }}/testdata/repo
      RESTIC_PASSWORD: secure-password
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: 'false'

      - name: Install restic
        run: |
          sudo apt-get update && sudo apt-get install -y restic

      - name: Verify restored data matches expected content
        run: .github/verify_restore.sh

  ci:
    name: Test
    # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-24.04", "ubuntu-26.04"]
    env:
      FAKE_DEV: /dev/fake-dev0
      ROOT_VOL: ${{ github.workspace }}/test/root
      TEST_SUBVOL: ${{ github.workspace }}/test/subvol
      TEST_SUBVOL_NAME: ".subvol"
      CONTENT: "hello, world"

      RESTIC_REPOSITORY: ${{ github.workspace }}/test/backup
      RESTIC_PASSWORD: secure-password
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: 'false'

      - name: Create virtual block device
        run: .github/create_block_device.sh "$RUNNER_TEMP/dev0-backstore" "$FAKE_DEV"

      - name: Create BTRFS volume
        run: .github/create_btrfs_volume.sh "$FAKE_DEV" "$ROOT_VOL"

      - name: Create BTRFS subvolume
        run: .github/create_btrfs_subvolume.sh "$FAKE_DEV" "$ROOT_VOL" "$TEST_SUBVOL_NAME" "$TEST_SUBVOL"

      - name: Add testdata to the subvolume
        run: |
          sudo mkdir $TEST_SUBVOL/sub
          sudo .github/output_content_to_file.sh "$CONTENT" "$TEST_SUBVOL/file.txt"
          sudo .github/output_content_to_file.sh "file should be ignored" "$TEST_SUBVOL/ignored1.txt"
          sudo .github/output_content_to_file.sh "file should also be ignored" "$TEST_SUBVOL/sub/ignored2.txt"

      - name: Install restic
        run: |
          sudo apt-get update && sudo apt-get install -y restic

      - name: Initialise restic repo
        # location & password come from the RESTIC_* environment variables
        run: |
          restic init

      - name: Set up systemd services
        run: .github/setup-systemd-services.sh "$ROOT_VOL" "$TEST_SUBVOL_NAME" "$TEST_SUBVOL" "$RESTIC_REPOSITORY" "$RESTIC_PASSWORD"

      - name: Run unit to backup subvolume
        run: .github/run_and_wait_for_unit_to_finish.sh btrfs-restic-backup@test.service

      - name: Verify backed up contents
        run: .github/verify_backed_up_content.sh "$TEST_SUBVOL/file.txt" "$CONTENT"

      - name: Verify existing contents
        run: .github/verify_content.sh "$TEST_SUBVOL/file.txt" "foo"

      - name: Delete subvolume including test data
        run: .github/delete_btrfs_subvolume.sh "$ROOT_VOL" "$TEST_SUBVOL_NAME" "$TEST_SUBVOL"

      - name: Restore from backup
        run: sudo --preserve-env='RESTIC_REPOSITORY,RESTIC_PASSWORD' scripts/btrfs-restic-restore.sh

      - name: Verify restored contents
        run: .github/verify_content.sh "$TEST_SUBVOL/file.txt" "$CONTENT"

      - name: Verify first ignored file not restored
        run: .github/verify_file_missing.sh "$TEST_SUBVOL/ignored1.txt"

      - name: Verify second ignored file not restored
        run: .github/verify_file_missing.sh "$TEST_SUBVOL/sub/ignored2.txt"

      - name: Check check was run
        run: test -f /var/lib/btrfs-restic-backup@test/last_check_time
